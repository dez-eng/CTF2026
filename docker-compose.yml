# GZCTF 单容器模式:题目镜像自含 MariaDB + Apache,无外部数据库依赖
# 本地测试:docker compose up -d --build
services:
  web:
    build: .
    container_name: football_ctf_web
    ports:
      - "8080:80"
    environment:
      # 动态 Flag:GZCTF 平台会为每个队伍注入唯一的 GZCTF_FLAG 环境变量(自动覆盖此逻辑);
      # 本地测试可修改此 FLAG 值模拟不同队伍
      - FLAG=flag{Test_Dynamic_Flag_2024}
    restart: unless-stopped
