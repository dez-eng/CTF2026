services:
  web:
    build: .
    container_name: football_ctf_web
    ports:
      - "8080:80"
    environment:
      # 动态 Flag:正式部署时必须由比赛平台注入每队唯一的 FLAG 值
      - FLAG=flag{Test_Dynamic_Flag_2024}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ctf_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: football_ctf_db
    environment:
      MYSQL_ROOT_PASSWORD: ctf_root_2024
      MYSQL_DATABASE: ctf_db
      MYSQL_USER: ctf_user
      MYSQL_PASSWORD: ctf_pass_2024
    volumes:
      - ./src/db.sql:/docker-entrypoint-initdb.d/db.sql
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pctf_root_2024"]
      timeout: 10s
      retries: 10
    networks:
      - ctf_network
    restart: unless-stopped

volumes:
  db_data:

networks:
  ctf_network:
    driver: bridge
